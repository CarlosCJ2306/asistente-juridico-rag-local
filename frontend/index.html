<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        try {
          const saved = JSON.parse(localStorage.getItem("ajrl.visual-preferences.v1") || "{}");
          const preference = ["light", "dark", "system"].includes(saved.theme) ? saved.theme : "system";
          document.documentElement.dataset.theme = preference === "system" && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : preference === "system" ? "light" : preference;
          document.documentElement.dataset.themePreference = preference;
        } catch { /* La apariencia visual usa el valor predeterminado. */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
